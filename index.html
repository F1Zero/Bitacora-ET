<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7D1C4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora ET">
<meta name="mobile-web-app-capable" content="yes">
<title>Bitácora ET</title>
<style>
:root{
  --guinda:#7D1C4B; --guinda-osc:#581135; --dorado:#BFA262; --dorado-osc:#9C7E3F;
  --card-guinda:#F6F1F3; --card-dorado:#F7F2E9; --linea:#E7DDE2;
  --bg:#f4eff1; --panel:#ffffff; --txt:#2b232a; --muted:#8a7f86;
  --ok:#2e7d52; --warn:#b4701f; --danger:#b23a48;
  --shadow:0 1px 3px rgba(88,17,53,.08), 0 6px 20px rgba(88,17,53,.06);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Segoe UI",Calibri,system-ui,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--txt); -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:1rem}
button{cursor:pointer}
.hex{display:inline-block;width:1em;height:1.1em;vertical-align:-.15em;
  background:var(--dorado);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
header.top{
  background:linear-gradient(100deg,var(--guinda),var(--guinda-osc));
  color:#fff;padding:env(safe-area-inset-top) 0 0;flex:0 0 auto;box-shadow:var(--shadow);z-index:20
}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--dorado);
  display:grid;place-items:center;color:var(--guinda-osc);font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand small{display:block;font-weight:400;font-size:.68rem;opacity:.85;letter-spacing:.3px}
.top .spacer{flex:1}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;font-size:1.15rem}
.icon-btn:active{background:rgba(255,255,255,.28)}
.syncdot{width:9px;height:9px;border-radius:50%;background:#c9b48f;margin-left:2px}
.syncdot.on{background:#8fe3a9}.syncdot.err{background:#ffb0b0}.syncdot.busy{background:#ffe08a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

main{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.view{display:none;padding:14px 14px 90px;max-width:960px;margin:0 auto}
.view.active{display:block}

/* ---------- Bottom nav ---------- */
nav.tabs{
  flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom);z-index:20
}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem}
nav.tabs button .ic{font-size:1.3rem;line-height:1}
nav.tabs button.active{color:var(--guinda);font-weight:600}
nav.tabs button.active .ic{transform:translateY(-1px)}

/* ---------- Common ---------- */
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px}
.pad{padding:14px}
h1,h2,h3{margin:0}
.sec-title{display:flex;align-items:center;gap:8px;margin:4px 2px 12px;font-size:1.05rem;color:var(--guinda-osc)}
.sec-title .count{margin-left:auto;background:var(--card-dorado);color:var(--dorado-osc);
  border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card-guinda);color:var(--guinda-osc);
  border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;border:1px solid var(--linea)}
.chip.est{color:#fff}
.tag-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{background:var(--guinda);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px}
.btn:active{background:var(--guinda-osc)}
.btn.sec{background:var(--card-guinda);color:var(--guinda)}
.btn.gold{background:var(--dorado);color:var(--guinda-osc)}
.btn.ghost{background:none;color:var(--guinda);border:1px solid var(--linea)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.btn.danger{background:#fbe9eb;color:var(--danger)}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;background:var(--guinda);color:#fff;border:0;font-size:1.8rem;
  box-shadow:0 6px 18px rgba(88,17,53,.4);z-index:15;display:grid;place-items:center}
.fab:active{background:var(--guinda-osc)}

label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:.8rem;font-weight:600;color:var(--guinda-osc);margin-bottom:4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;
  background:#fff;color:var(--txt)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--dorado);border-color:transparent}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* list items */
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linea);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--card-guinda)}
.item .avatar{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  font-size:1.25rem;background:var(--card-dorado)}
.item .main{flex:1;min-width:0}
.item .main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main .s{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{text-align:right;font-size:.72rem;color:var(--muted);flex:0 0 auto}

.daygroup{margin-bottom:14px}
.dayhdr{position:sticky;top:0;background:var(--bg);padding:6px 4px;font-weight:700;color:var(--guinda-osc);
  font-size:.84rem;text-transform:capitalize;z-index:5}

/* empty */
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:2.6rem;opacity:.5}

/* search bar */
.searchbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.searchbar input{flex:1}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.filters .chip{white-space:nowrap;cursor:pointer;background:#fff}
.filters .chip.on{background:var(--guinda);color:#fff;border-color:var(--guinda)}

/* progress */
.prog{height:8px;background:var(--linea);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--dorado),var(--guinda))}

/* task */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--linea)}
.task:last-child{border-bottom:0}
.check{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--dorado);
  display:grid;place-items:center;color:#fff;font-size:.9rem;margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:500}

/* attachments */
.attgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.att{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--linea);background:var(--card-dorado)}
.att img{width:100%;height:100%;object-fit:cover}
.att .file{display:grid;place-items:center;height:100%;font-size:1.6rem;color:var(--dorado-osc)}
.att .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:.8rem;line-height:1}
.att .nm{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:.55rem;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .cloud{position:absolute;bottom:2px;left:2px;background:rgba(46,125,82,.92);color:#fff;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-size:.6rem}

/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(43,35,42,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;animation:up .22s ease}
@media(min-width:641px){.sheet{border-radius:18px;margin-bottom:3vh}.sheet-bg{align-items:center}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea);flex:0 0 auto}
.sheet header h3{flex:1;font-size:1.02rem;color:var(--guinda-osc)}
.sheet .body{overflow:auto;padding:16px}
.sheet footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--linea);flex:0 0 auto}
.sheet footer .btn{flex:1;justify-content:center}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--guinda-osc);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;
  box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* detail header */
.detail-hero{background:linear-gradient(120deg,var(--guinda),var(--guinda-osc));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.detail-hero h2{font-size:1.2rem;margin-bottom:6px}
.detail-hero .meta-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.detail-hero .chip{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}

.kv{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.kv:last-child{border-bottom:0}
.kv b{flex:0 0 42%;color:var(--guinda-osc);font-weight:600}
.kv span{flex:1;white-space:pre-wrap}
a.maplink{color:var(--guinda);font-weight:600;text-decoration:none}

.pwa-banner{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));
  background:var(--guinda-osc);color:#fff;border-radius:14px;padding:12px 14px;display:none;gap:10px;align-items:center;z-index:30;box-shadow:var(--shadow)}
.pwa-banner.show{display:flex}
.pwa-banner .btn{background:var(--dorado);color:var(--guinda-osc);padding:7px 12px}
.hidden{display:none!important}

/* ---------- Pantalla de acceso ---------- */
#login{position:fixed;inset:0;z-index:80;background:linear-gradient(140deg,var(--guinda),var(--guinda-osc));
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
#login .box{background:var(--panel);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:100%;max-width:380px;padding:26px 22px}
#login .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(120deg,var(--guinda),var(--guinda-osc));display:grid;place-items:center;margin:0 auto 12px}
#login .logo span{color:var(--dorado);font-weight:800;font-size:1.4rem}
#login h1{text-align:center;color:var(--guinda-osc);font-size:1.3rem;margin-bottom:2px}
#login .sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:18px}
#login .err{background:#fbe9eb;color:var(--danger);border-radius:10px;padding:8px 12px;font-size:.84rem;margin-bottom:12px;display:none}
#login .err.show{display:block}
#login .foot{text-align:center;color:rgba(255,255,255,.8);font-size:.72rem;margin-top:16px}

/* ---------- Roles / Equipo ---------- */
.role{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;color:#fff}
.role.desarrollador{background:#7D1C4B}.role.administrador{background:#1f6f8b}.role.usuario{background:#2e7d52}.role.observador{background:#8a7f86}
.person .avatar{background:var(--card-guinda);color:var(--guinda);font-weight:800}
.perm-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--linea)}
.perm-row:last-child{border-bottom:0}
.perm-row .pl{flex:1;font-size:.86rem}
.perm-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:4px;font-size:.66rem;text-align:center;align-items:center}
.perm-grid .hd{font-weight:700;color:var(--guinda-osc);padding:4px 2px}
.perm-grid .cap{text-align:left;font-size:.74rem;padding:5px 2px;color:var(--txt)}
.perm-grid input{width:18px;height:18px}
.me-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 10px;font-size:.74rem}
.hr{height:1px;background:var(--linea);margin:12px 0;border:0}
.small{font-size:.8rem}
.right{margin-left:auto}

/* ---------- Dashboard (KPIs estilo panel) ---------- */
.dash-hero{background:linear-gradient(120deg,var(--guinda),var(--guinda-osc) 70%,#3f0d26);
  border-radius:18px;padding:16px 16px 18px;color:#fff;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(191,162,98,.55), rgba(191,162,98,0) 70%)}
.dash-hero .hi{font-size:1.15rem;font-weight:700;letter-spacing:.2px}
.dash-hero .sub{font-size:.8rem;opacity:.85;margin-top:2px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;position:relative;z-index:1}
@media(max-width:560px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 12px;
  backdrop-filter:blur(2px);cursor:pointer;transition:transform .12s, background .15s}
.kpi:active{transform:scale(.97)}
.kpi .n{font-size:1.5rem;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.kpi .l{font-size:.68rem;opacity:.9;margin-top:2px;line-height:1.15}
.kpi .ic{font-size:.95rem}
.kpi.gold .n{color:var(--dorado)}
.kpi.warn .n{color:#ffd9a8}
.kpi.ok .n{color:#b7f0c9}
.dash-mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dash-mini .m{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:8px 12px;font-size:.78rem;
  color:var(--txt);display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.dash-mini .m b{color:var(--guinda-osc)}

/* ---------- Calendario (estilo DayNotez) ---------- */
.view-toggle{display:flex;gap:6px;margin-bottom:10px}
.view-toggle button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--linea);background:#fff;color:var(--muted);font-weight:600;font-size:.84rem}
.view-toggle button.on{background:var(--guinda);color:#fff;border-color:var(--guinda)}
.cal{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;margin-bottom:14px}
.cal-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-hd .m{flex:1;text-align:center;font-weight:700;color:var(--guinda-osc);text-transform:capitalize;font-size:1.02rem}
.cal-nav{background:var(--card-guinda);color:var(--guinda);border:0;width:36px;height:36px;border-radius:10px;font-size:1.25rem;line-height:1}
.cal-nav:active{background:var(--guinda);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;grid-auto-rows:max-content}
.cal-dow{text-align:center;font-size:.68rem;color:var(--muted);font-weight:700;padding:3px 0}
.cal-dow.wk{color:var(--dorado-osc)}
.cal-cell{min-height:58px;border:1px solid var(--linea);border-radius:8px;padding:2px 2px 2px;
  display:flex;flex-direction:column;cursor:pointer;background:#fff;position:relative;overflow:hidden}
.cal-cell.blank{border:0;background:none;cursor:default}
.cal-cell .n{font-size:.68rem;color:var(--muted);font-weight:700;line-height:1;padding:1px 2px}
.cal-cell.wknd{background:var(--card-dorado)}
.cal-cell.today{outline:2px solid #5a535f;outline-offset:-2px}
.cal-cell.today .n{color:#3a3340}
.cal-cell.sel{background:#ECE7EA;box-shadow:inset 0 0 0 2px #5a535f;border-color:transparent}
.cal-cell.sel .n{color:#3a3340}
.cal-cell .ics{display:flex;flex-wrap:wrap;gap:0;font-size:.8rem;line-height:1.05;padding:0 1px;align-content:flex-start;flex:0 0 auto}
.cal-cell .more{font-size:.52rem;color:var(--dorado-osc);font-weight:800}
.cal-cell.sel .more{color:var(--dorado-osc)}
.cal-cell .tmark{font-size:.6rem;color:#2e7d52;font-weight:800;margin-left:1px;line-height:1}
/* líneas de proyecto (cómo está agendado cada programa) */
.cal-cell .bars{display:block;margin-top:auto;pointer-events:none}
.cal-cell .bar{display:block;height:4px;margin-bottom:2px}
.cal-cell .bar.blank{background:transparent}
.cal-cell .bar.s{border-top-left-radius:3px;border-bottom-left-radius:3px;margin-left:1px}
.cal-cell .bar.e{border-top-right-radius:3px;border-bottom-right-radius:3px;margin-right:1px}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;padding-top:8px;border-top:1px solid var(--linea)}
.cal-legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;color:var(--txt);cursor:pointer;max-width:48%}
.cal-legend .lg .sw{width:14px;height:5px;border-radius:3px;flex:0 0 auto}
.cal-legend .lg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
.dayhead .d{font-weight:700;color:var(--guinda-osc);text-transform:capitalize;font-size:.98rem;flex:1}
@media(max-width:380px){.cal-cell{min-height:52px}.cal-cell .ics{font-size:.7rem}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="box">
    <div class="logo"><span>ET</span></div>
    <h1>Bitácora ET</h1>
    <div class="sub">Estudios Territoriales · SEGEY</div>
    <div class="err" id="loginErr"></div>
    <label class="fld"><span>Usuario</span><input id="li_user" autocomplete="username" autocapitalize="none" placeholder="tu usuario"></label>
    <label class="fld"><span>Contraseña</span><input id="li_pass" type="password" autocomplete="current-password" placeholder="tu contraseña"></label>
    <button class="btn block" id="li_btn">Entrar</button>
  </div>
  <div class="foot">Acceso para el equipo de Estudios Territoriales</div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <div class="brand" id="brand" style="cursor:pointer" onclick="showAbout()">
        <div class="logo">ET</div>
        <div>Bitácora ET<small>Estudios Territoriales · SEGEY</small></div>
      </div>
      <div class="spacer"></div>
      <div class="syncdot" id="syncDot" title="Sincronización"></div>
      <button class="icon-btn" id="btnSync" title="Sincronizar">⟳</button>
      <button class="icon-btn" id="btnCfg" title="Configuración">⚙</button>
    </div>
  </header>

  <main>
    <!-- BITÁCORA -->
    <section class="view active" id="v-bitacora">
      <div class="searchbar">
        <input id="bitSearch" placeholder="Buscar en la bitácora…">
      </div>
      <div class="view-toggle">
        <button id="tgCal" class="on" onclick="setBitView('cal')">📅 Calendario</button>
        <button id="tgList" onclick="setBitView('list')">☰ Lista</button>
      </div>
      <div class="filters" id="bitFilters"></div>
      <div id="bitCal"></div>
      <div id="bitList"></div>
    </section>

    <!-- PROYECTOS -->
    <section class="view" id="v-proyectos">
      <div id="projDash"></div>
      <div class="sec-title"><span class="hex"></span> Proyectos <span class="count" id="projCount">0</span></div>
      <div class="filters" id="projFilters"></div>
      <div id="projList"></div>
    </section>

    <!-- TAREAS -->
    <section class="view" id="v-tareas">
      <div class="sec-title"><span class="hex"></span> Tareas <span class="count" id="taskCount">0</span></div>
      <div class="filters" id="taskFilters"></div>

<script>
/* ============================================================
   Bitácora ET — app de archivo único (PWA)

"use strict";

/* ---------- conexión del equipo (pre-configurada) ---------- */
// Backend Apps Script (cuenta mapas.segey@gmail.com) + hoja "Bitácora ET - Datos".
const DEFAULT_SYNC_URL = 'https://script.google.com/macros/s/AKfycbyksw3rF9BLiOJuq3yQByRQqVtbJ-KmF-r-THf2xlso5k-zD8do5cUT40yS80uu-mggBQ/exec';
const DEFAULT_TOKEN    = 'BITACORAET2026';

/* ---------- utilidades ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const now = ()=> Date.now();
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = ()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); const dd=new Date(+y,+m-1,+d);
  return dd.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtShort(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function relTime(ts){ if(!ts) return ''; const s=(now()-ts)/1000; if(s<60) return 'ahora';
  if(s<3600) return Math.floor(s/60)+' min'; if(s<86400) return Math.floor(s/3600)+' h';
  const d=Math.floor(s/86400); return d<30? d+' d' : fmtShort(new Date(ts).toISOString().slice(0,10)); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- catálogos ---------- */
const ESTADOS = [
  {k:'planeacion', t:'Planeación', c:'#8a7f86'},

];
const estInfo = k => ESTADOS.find(e=>e.k===k) || ESTADOS[0];

// Clasificaciones de archivos (editable). Se auto-sugiere por el tipo de archivo.
const CLASIF = [
  {k:'cartografia',  t:'Cartografía',   icon:'🗺️'},
  {k:'documento',    t:'Documento',     icon:'📄'},
  {k:'datos',        t:'Datos / Excel', icon:'📊'},
  {k:'fotografia',   t:'Fotografía',    icon:'📷'},
  {k:'multimedia',   t:'Audio / Video', icon:'🎬'},
  {k:'normatividad', t:'Normatividad',  icon:'⚖️'},
  {k:'otro',         t:'Otro',          icon:'📦'},
];
const clasifInfo = k => CLASIF.find(c=>c.k===k) || CLASIF[CLASIF.length-1];
function autoClasif(type,name){
  const s=((type||'')+' '+(name||'')).toLowerCase();
  if(/kml|kmz|google-earth|\.shp|geojson|\.gpx/.test(s)) return 'cartografia';
  if(/sheet|excel|csv|\.xls|\.csv/.test(s))              return 'datos';
  if(/^image\/|\.jpg|\.jpeg|\.png|\.heic|\.webp/.test(s))return 'fotografia';
  if(/^video\/|^audio\/|\.mp4|\.mov|\.mp3|\.wav|\.m4a/.test(s)) return 'multimedia';
  if(/pdf|word|document|\.doc|\.txt|\.rtf/.test(s))      return 'documento';
  return 'otro';
}

// Plantillas de nota. Cada campo: id, etiqueta, tipo (text, area, num, gps)
const TEMPLATES = {
  libre:   {t:'Nota libre',     icon:'📝', campos:[]},
  visita:  {t:'Visita de campo',icon:'📍', campos:[
      {id:'localidad', l:'Localidad', tipo:'text'},
      {id:'cct',       l:'Clave CT',  tipo:'text'},

  ]},
  avance:  {t:'Reporte de avance', icon:'📈', campos:[
      {id:'avance',    l:'% de avance', tipo:'num'},
      {id:'realizado', l:'Actividades realizadas', tipo:'area'},
      {id:'pendiente', l:'Pendientes', tipo:'area'},
      {id:'riesgos',   l:'Riesgos / bloqueos', tipo:'area'},
  ]},
};

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME='bitacoraET', DB_VER=2;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id'});
    if(!d.objectStoreNames.contains('entries'))  d.createObjectStore('entries',{keyPath:'id'});
    if(!d.objectStoreNames.contains('tasks'))    d.createObjectStore('tasks',{keyPath:'id'});
    if(!d.objectStoreNames.contains('files'))    d.createObjectStore('files',{keyPath:'id'});
    if(!d.objectStoreNames.contains('atts'))     d.createObjectStore('atts',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))     d.createObjectStore('meta',{keyPath:'k'});
  };
  r.onsuccess=e=>{db=e.target.result;res();};
  r.onerror=e=>rej(e);
});}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
function dbGetAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=rej;});}
function dbPut(store,v){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=rej;});}
function dbGet(store,k){return new Promise((res,rej)=>{const r=tx(store).get(k);r.onsuccess=()=>res(r.result);r.onerror=rej;});}
function dbDel(store,k){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=rej;});}
async function metaGet(k,def){const v=await dbGet('meta',k);return v?v.v:def;}
async function metaSet(k,v){return dbPut('meta',{k,v});}

/* ---------- estado en memoria (cache) ---------- */
const _nowD = new Date();
const S = {projects:[], entries:[], tasks:[], files:[], attBytes:{}, cfg:{}, tab:'bitacora',
  bitFilter:'all', bitQuery:'', projFilter:'all', taskFilter:'pend', detailId:null,
  bitView:'cal', calY:_nowD.getFullYear(), calM:_nowD.getMonth(), calSel:todayISO(),
  fileFilter:'all', fileQuery:'', fileSort:'recientes',
  session:null, team:[], perms:null};

/* ---------- Roles y permisos ---------- */
const ROLES = [
  {k:'desarrollador', t:'Desarrollador', d:'Acceso total: gestiona equipo, permisos y ajustes.'},
  {k:'administrador', t:'Administrador', d:'Crea y edita cualquier contenido; sin ajustes del sistema.'},
  {k:'usuario',       t:'Usuario',       d:'Crea y edita solo lo suyo; ve lo demás.'},
  {k:'observador',    t:'Observador',    d:'Solo lectura.'},
];
const roleInfo = k => ROLES.find(r=>r.k===k) || ROLES[2];
const CAPS = [
  {k:'crear',          t:'Crear contenido'},
  {k:'editarPropio',   t:'Editar/borrar lo propio'},
  {k:'editarTodo',     t:'Editar/borrar de todos'},
  {k:'gestionarEquipo',t:'Gestionar equipo'},
  {k:'ajustes',        t:'Ajustes del sistema'},
];
const DEFAULT_PERMS = {
  desarrollador:{crear:true, editarPropio:true, editarTodo:true, gestionarEquipo:true, ajustes:true},
  administrador:{crear:true, editarPropio:true, editarTodo:true, gestionarEquipo:false, ajustes:false},
  usuario:      {crear:true, editarPropio:true, editarTodo:false, gestionarEquipo:false, ajustes:false},
  observador:   {crear:false,editarPropio:false,editarTodo:false, gestionarEquipo:false, ajustes:false},
};
const myRole = ()=> S.session ? S.session.role : 'observador';
const myUser = ()=> S.session ? String(S.session.username).toLowerCase() : '';
function cap(k){ const p=(S.perms||DEFAULT_PERMS)[myRole()]||{}; return !!p[k]; }
const canCreate = ()=> cap('crear');
function canEditItem(owner){
  if(cap('editarTodo')) return true;
  if(cap('editarPropio')) return !!owner && String(owner).toLowerCase()===myUser();
  return false;
}
const canManageTeam = ()=> cap('gestionarEquipo');
const canSettings   = ()=> cap('ajustes');

async function loadAll(){
  S.projects = await dbGetAll('projects');
  S.entries  = await dbGetAll('entries');
  S.tasks    = await dbGetAll('tasks');
  S.files    = await dbGetAll('files');
  const atts  = await dbGetAll('atts');   // cache local de bytes (no se sincroniza)
  S.attBytes = {}; atts.forEach(a=>{ S.attBytes[a.id]=a.dataUrl; });
  S.cfg = await metaGet('cfg', {autor:'', url:DEFAULT_SYNC_URL, token:DEFAULT_TOKEN, lastSync:0});
  S.session = await metaGet('session', null);
  S.perms   = await metaGet('perms', null) || DEFAULT_PERMS;
  S.team    = await metaGet('team', []);
  // Asegurar conexión por defecto y migrar token viejo (p.ej. MINUTAS2026 → BITACORAET2026)
  let _cfgChanged=false;
  if(!S.cfg.url && DEFAULT_SYNC_URL){ S.cfg.url=DEFAULT_SYNC_URL; _cfgChanged=true; }
  if(S.cfg.url===DEFAULT_SYNC_URL && S.cfg.token!==DEFAULT_TOKEN){ S.cfg.token=DEFAULT_TOKEN; _cfgChanged=true; }
  if(!S.cfg.token){ S.cfg.token=DEFAULT_TOKEN; _cfgChanged=true; }
  if(_cfgChanged) await metaSet('cfg',S.cfg);
}
const activeProjects = ()=> S.projects.filter(p=>!p.deleted);
const activeEntries  = ()=> S.entries.filter(e=>!e.deleted);
const activeTasks    = ()=> S.tasks.filter(t=>!t.deleted);
const activeFiles    = ()=> S.files.filter(f=>!f.deleted);
const projById = id => S.projects.find(p=>p.id===id);

/* ============================================================
   Navegación
   ============================================================ */
function go(tab){
  S.tab=tab;
  $$('.view').forEach(v=>v.classList.remove('active'));
  $$('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='detalle'){ $('#v-detalle').classList.add('active'); }
  else { $('#v-'+tab).classList.add('active'); S.detailId=null; }
  render();
  applyRoleUI();
}
$$('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ============================================================
   Render
   ============================================================ */
function render(){
  if(S.tab==='bitacora') renderBitacora();
  else if(S.tab==='proyectos') renderProyectos();
  else if(S.tab==='tareas') renderTareas();
  else if(S.tab==='archivos') renderArchivos();
  else if(S.tab==='equipo') renderEquipo();
  else if(S.tab==='detalle') renderDetalle();
}

/* ---- Bitácora ---- */
function renderBitacora(){
  // filtros por proyecto
  const f=$('#bitFilters'); f.innerHTML='';
  const mk=(k,label)=>{const c=document.createElement('span');c.className='chip'+(S.bitFilter===k?' on':'');c.textContent=label;c.onclick=()=>{S.bitFilter=k;renderBitacora();};return c;};
  f.appendChild(mk('all','Todas'));
  activeProjects().forEach(p=>f.appendChild(mk(p.id,p.name)));

  $('#tgCal').classList.toggle('on', S.bitView==='cal');
  $('#tgList').classList.toggle('on', S.bitView==='list');

  const q=S.bitQuery.trim().toLowerCase();
  const cal=$('#bitCal'), box=$('#bitList');
  // buscar o modo lista -> lista cronológica
  if(q || S.bitView==='list'){ cal.style.display='none'; renderBitList(q); return; }
  cal.style.display=''; renderCalendar(); renderDayEntries();
}

function entriesFiltered(){
  let list=activeEntries();
  if(S.bitFilter!=='all') list=list.filter(e=>e.projectId===S.bitFilter);
  return list;
}
function entryItemHTML(e){
  const p=projById(e.projectId); const tpl=TEMPLATES[e.tipo]||TEMPLATES.libre;
  const natt=(e.adjuntos||[]).length;
  return `<div class="item" onclick="openEntry('${e.id}')">
    <div class="avatar">${tpl.icon}</div>
    <div class="main">
      <div class="t">${esc(e.titulo||tpl.t)}</div>
      <div class="s">${esc((e.cuerpo||resumenCampos(e)||'').slice(0,160))}</div>
      <div class="row wrap" style="margin-top:5px;gap:6px">
        ${p?`<span class="chip"><span class="tag-dot" style="background:${estInfo(p.estado).c}"></span>${esc(p.name)}</span>`:''}
        ${e.campos&&e.campos.gps?`<span class="chip">📍 GPS</span>`:''}
        ${natt?`<span class="chip">📎 ${natt}</span>`:''}
      </div>
    </div>
    <div class="meta">${esc(tpl.t)}<br>${esc(relTime(e.updatedAt||e.createdAt))}</div>
  </div>`;
}
function renderBitList(q){
  let list=entriesFiltered();
  if(q){ list=list.filter(e=>{ const p=projById(e.projectId);
    return [e.titulo,e.cuerpo,p&&p.name,JSON.stringify(e.campos||{})].join(' ').toLowerCase().includes(q); }); }
  list.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||b.createdAt-a.createdAt);
  const box=$('#bitList');
  if(!list.length){ box.innerHTML=emptyBox('📓', q?'Sin resultados':'Aún no hay notas', q?'Prueba con otra palabra.':'Toca ＋ para registrar la primera nota.'); return; }
  const groups={}; list.forEach(e=>{(groups[e.fecha]=groups[e.fecha]||[]).push(e);});
  let html='';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(fecha=>{
    html+=`<div class="daygroup"><div class="dayhdr">${esc(fmtDate(fecha))}</div><div class="card">`;
    groups[fecha].forEach(e=>html+=entryItemHTML(e));
    html+=`</div></div>`;
  });
  box.innerHTML=html;
}

/* ---- Calendario mensual (estilo DayNotez: iconos por día) ---- */
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pad2(n){return String(n).padStart(2,'0');}
// un color distinto por proyecto (estable según su orden)
const PROJ_PALETTE=['#7D1C4B','#1f6f8b','#2e7d52','#b4701f','#8e44ad','#c0392b','#16a085','#BFA262','#d35400','#2c3e50'];
function projColor(id){ const i=activeProjects().findIndex(p=>p.id===id); return PROJ_PALETTE[(i<0?0:i)%PROJ_PALETTE.length]; }
function scheduledProjects(){
  let projs=activeProjects().filter(p=>p.inicio||p.fin);
  if(S.bitFilter!=='all') projs=projs.filter(p=>p.id===S.bitFilter);
  return projs.map(p=>{ const a=p.inicio||p.fin, b=p.fin||p.inicio;
    return {id:p.id, name:p.name, start:(a<=b?a:b), end:(a<=b?b:a), color:projColor(p.id)}; })
    .sort((x,y)=>x.start.localeCompare(y.start)).slice(0,6); // hasta 6 líneas
}
function renderCalendar(){
  const y=S.calY, m=S.calM, prefix=`${y}-${pad2(m+1)}-`;
  const byDay={};
  entriesFiltered().forEach(e=>{ if(e.fecha&&e.fecha.startsWith(prefix)){ (byDay[e.fecha]=byDay[e.fecha]||[]).push(e); } });
  const tByDay={};
  (S.bitFilter==='all'?activeTasks():activeTasks().filter(t=>t.projectId===S.bitFilter))
    .forEach(t=>{ if(t.vence&&t.vence.startsWith(prefix)){ (tByDay[t.vence]=tByDay[t.vence]||[]).push(t); } });
  const startDow=(new Date(y,m,1).getDay()+6)%7;      // lunes=0
  const daysIn=new Date(y,m+1,0).getDate();
  const today=todayISO();
  const lanes=scheduledProjects();                    // líneas de proyecto
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysIn; d++){
    const iso=prefix+pad2(d);
    const dow=(startDow+d-1)%7, wknd=(dow>=5);
    const ents=byDay[iso]||[];
    const icons=ents.slice(0,3).map(e=>(TEMPLATES[e.tipo]||TEMPLATES.libre).icon).join('');
    const more=ents.length>3?`<span class="more">+${ents.length-3}</span>`:'';
    const tdue=tByDay[iso]||[];
    const tmark=tdue.length?`<span class="tmark">✓${tdue.length>1?tdue.length:''}</span>`:'';
    let bars='';
    if(lanes.length){ bars='<div class="bars">'+lanes.map(l=>{
      if(iso>=l.start && iso<=l.end){ const c='bar'+(iso===l.start?' s':'')+(iso===l.end?' e':'');
        return `<div class="${c}" style="background:${l.color}"></div>`; }
      return `<div class="bar blank"></div>`;
    }).join('')+'</div>'; }
    const cls=['cal-cell']; if(iso===S.calSel)cls.push('sel'); if(iso===today)cls.push('today'); if(wknd&&iso!==S.calSel)cls.push('wknd');
    cells+=`<div class="${cls.join(' ')}" onclick="selDay('${iso}')"><span class="n">${d}</span><div class="ics">${icons}${more}${tmark}</div>${bars}</div>`;
  }
  const dows=['L','M','M','J','V','S','D'];
  const legend = lanes.length? `<div class="cal-legend">`+lanes.map(l=>`<span class="lg" onclick="openDetalle('${l.id}')"><span class="sw" style="background:${l.color}"></span><span class="nm">${esc(l.name)}</span></span>`).join('')+`</div>`:'';
  $('#bitCal').innerHTML=`<div class="cal">
    <div class="cal-hd">
      <button class="cal-nav" onclick="calShift(-1)">‹</button>
      <div class="m">${MONTHS[m]} ${y}</div>
      <button class="cal-nav" onclick="calShift(1)">›</button>
    </div>
    <div class="cal-grid">${dows.map((w,i)=>`<div class="cal-dow${i>=5?' wk':''}">${w}</div>`).join('')}${cells}</div>
    ${legend}
  </div>`;
}
function calShift(delta){ let m=S.calM+delta, y=S.calY; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.calM=m; S.calY=y; renderBitacora(); }
function selDay(iso){ S.calSel=iso; renderBitacora(); }
function setBitView(v){ S.bitView=v; renderBitacora(); }
function renderDayEntries(){
  const iso=S.calSel;
  const ents=entriesFiltered().filter(e=>e.fecha===iso).sort((a,b)=>b.createdAt-a.createdAt);
  let html=`<div class="dayhead"><div class="d">${esc(fmtDate(iso))}</div>
    ${canCreate()?`<button class="btn gold sm" onclick="newEntryForDay()">＋ nota</button> <button class="btn sm" onclick="newTaskForDay()">＋ tarea</button>`:''}</div>`;
  if(!ents.length) html+=`<div class="card"><div class="empty" style="padding:26px 16px"><div class="big">📓</div><div class="muted" style="margin-top:6px">Sin notas este día.<br>Toca «＋ nota» para agregar una.</div></div></div>`;
  else html+=`<div class="card">`+ents.map(entryItemHTML).join('')+`</div>`;
  // tareas que vencen este día
  const tdue=activeTasks().filter(t=>t.vence===iso && (S.bitFilter==='all'||t.projectId===S.bitFilter))
    .sort((a,b)=>(!!a.hecho-!!b.hecho)||b.createdAt-a.createdAt);
  if(tdue.length){
    html+=`<div class="sec-title" style="margin:16px 2px 8px;font-size:.95rem"><span class="hex"></span> Tareas que vencen <span class="count">${tdue.length}</span></div><div class="card" style="padding:4px 14px">`;

function fmtSize(b){ if(!b) return ''; if(b<1024) return b+' B'; if(b<1048576) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function allFileItems(){
  const items=[];

  activeEntries().forEach(e=>(e.adjuntos||[]).forEach(a=>items.push({
    id:a.id, name:a.name, type:a.type, size:a.size||0, fecha:e.fecha, descripcion:e.titulo||'',

    source:'nota', entryId:e.id, createdAt:e.createdAt, updatedAt:e.updatedAt })));

}

function renderArchivos(){
  const f=$('#fileFilters'); f.innerHTML='';

  else items.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.createdAt||0)-(a.createdAt||0));

  const box=$('#fileList');
  if(!items.length){ box.innerHTML=emptyBox('🗂️', (q||S.fileFilter!=='all')?'Sin archivos':'Aún no hay archivos', 'Toca ＋ para subir Excel, KML, PDF, fotos, video… sin necesidad de una nota.'); return; }
  const grp=(title,arr)=>`<div class="daygroup"><div class="dayhdr">${esc(title)}</div><div class="card">`+arr.map(fileItemHTML).join('')+`</div></div>`;
  let html='';

    const g={}; items.forEach(i=>{(g[i.clasificacion]=g[i.clasificacion]||[]).push(i);});
    CLASIF.forEach(c=>{ if(g[c.k]) html+=grp(`${c.icon} ${c.t}`, g[c.k]); });
  } else if(S.fileSort==='recientes'){
    const g={}; items.forEach(i=>{const k=(i.fecha||'').slice(0,7)||'0000-00';(g[k]=g[k]||[]).push(i);});

  box.innerHTML=html;

function readAsDataURL(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);}); }

  ]);

async function saveNewFiles(){
  if(!_pendingFiles.length){ toast('Selecciona al menos un archivo'); return; }
  const fecha=$('#nf_fecha').value||todayISO(), clas=$('#nf_clas').value, projectId=$('#nf_proj').value, desc=$('#nf_desc').value.trim();
  const pName=(projById(projectId)||{}).name||'';
  let ok=0;
  for(const file of _pendingFiles){
    if(file.size>MAX_ATT){ toast(`"${file.name}" supera 25 MB; omitido`); continue; }
    const dataUrl=await readAsDataURL(file);
    const rec={id:uid(),name:file.name,type:file.type||'application/octet-stream',size:file.size,
      fecha,descripcion:desc,clasificacion:clas,projectId,driveId:null,url:null,createdBy:myUser(),createdAt:now(),updatedAt:now(),deleted:false};
    if(S.cfg.url){ try{ setDot('busy'); toast('Subiendo '+file.name+'…');
      const up=await driveUpload({name:rec.name,type:rec.type,dataUrl}, pName); rec.driveId=up.id; rec.url=up.url; ok++;
    }catch(err){ console.error(err); toast('No se pudo subir '+file.name+' (queda local)'); } }
    await dbPut('files',rec); S.files.push(rec);
    await dbPut('atts',{id:rec.id,entryId:'__file__',dataUrl}); S.attBytes[rec.id]=dataUrl;
  }
  updateSyncDot(); closeSheet(); toast(`${_pendingFiles.length} archivo(s) guardado(s)${ok?` · ${ok} en Drive`:''}`); scheduleSync(); render();
}
async function saveFileMeta(id){
  const f=S.files.find(x=>x.id===id); if(!f) return;
  f.fecha=$('#nf_fecha').value||f.fecha; f.clasificacion=$('#nf_clas').value; f.projectId=$('#nf_proj').value; f.descripcion=$('#nf_desc').value.trim(); f.updatedAt=now();

async function delFile(id){

function openEntryKeep(id,draft){ // reabrir editor con un borrador (al cambiar plantilla)

function collectEntry(e){

function iconFor(type,name){
  const t=(type||'')+' '+(name||'').toLowerCase();
  if(/image\//.test(type)) return '🖼️'; if(/video\//.test(type)) return '🎬'; if(/audio\//.test(type)) return '🎵';
  if(/pdf/.test(t)) return '📕'; if(/sheet|excel|csv|\.xls|\.csv/.test(t)) return '📊';
  if(/word|document|\.doc/.test(t)) return '📄'; if(/kml|kmz|google-earth/.test(t)) return '🌐';
  if(/zip|compress|rar|7z/.test(t)) return '🗜️'; return '📎';
}
function renderAtts(){
  const box=$('#e_atts'); if(!box) return; box.innerHTML='';
  _editEntryAtts.forEach((a,i)=>{ const d=document.createElement('div');d.className='att';
    const thumb = a.dataUrl && (a.type||'').startsWith('image/') ? a.dataUrl
      : (a.driveId && (a.type||'').startsWith('image/') ? `https://drive.google.com/thumbnail?id=${a.driveId}&sz=w200` : '');
    const cloud = a.driveId ? `<div class="cloud" title="En Google Drive">☁</div>` : '';
    d.innerHTML = thumb
      ? `<img src="${thumb}" referrerpolicy="no-referrer"><button class="x" type="button">✕</button>${cloud}`
      : `<div class="file">${iconFor(a.type,a.name)}</div><div class="nm">${esc(a.name||'archivo')}</div><button class="x" type="button">✕</button>${cloud}`;
    d.querySelector('.x').onclick=ev=>{ev.stopPropagation();_editEntryAtts.splice(i,1);renderAtts();};
    d.onclick=ev=>{ if(ev.target.classList.contains('x'))return; const dst=a.url||a.dataUrl; if(dst) window.open(dst,'_blank'); };
    box.appendChild(d);
  });
}
function pickFile(mode){ $(mode==='cam'?'#e_file':'#e_file2').click(); }
const MAX_ATT = 25*1024*1024; // 25 MB por archivo
function addFiles(files){
  [...files].forEach(f=>{
    if(f.type.startsWith('image/') && f.size>1.5*1024*1024){
      compressImage(f).then(du=>{_editEntryAtts.push({id:uid(),name:f.name,type:'image/jpeg',size:du.length,dataUrl:du});renderAtts();}); return;
    }
    if(f.size>MAX_ATT){ toast(`"${f.name}" supera 25 MB; súbelo manual a Drive y pega el enlace.`); return; }
    const r=new FileReader(); r.onload=()=>{ _editEntryAtts.push({id:uid(),name:f.name,type:f.type||'application/octet-stream',size:f.size,dataUrl:r.result}); renderAtts(); };
    r.readAsDataURL(f);
  });
}
function compressImage(file){ return new Promise(res=>{
  const img=new Image(); const r=new FileReader();
  r.onload=()=>{ img.onload=()=>{ const max=1600; let {width:w,height:h}=img;
    if(w>max||h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',.82)); };
    img.src=r.result; };
  r.readAsDataURL(file);
});}
async function grabGPS(fieldId){
  const m=$('#'+fieldId+'_m'); if(m)m.textContent='Obteniendo ubicación…';
  if(!navigator.geolocation){ if(m)m.textContent='GPS no disponible'; return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo,accuracy:ac}=pos.coords;
    $('#'+fieldId).value=`${la.toFixed(6)}, ${lo.toFixed(6)}`;
    if(m)m.innerHTML=`±${Math.round(ac)} m · <a class="maplink" href="https://maps.google.com/?q=${la},${lo}" target="_blank">ver en mapa</a>`;
  }, err=>{ if(m)m.textContent='No se pudo obtener ubicación ('+err.message+')'; },
  {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
async function driveUpload(att, projectName){
  const res=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({token:S.cfg.token, action:'upload', name:att.name, mime:att.type, data:att.dataUrl, projectName})});
  const d=await res.json(); if(!d.ok) throw new Error(d.error||'falló la subida'); return d;
}
async function saveEntry(id,e0){
  const data=collectEntry(e0);
  if(!data.titulo && !data.cuerpo && !Object.keys(data.campos).length && !_editEntryAtts.length){ toast('Escribe algo primero'); return; }
  const rec = id? S.entries.find(x=>x.id===id) : {id:uid(),createdAt:now(),createdBy:myUser()};
  const prevAtts = id? (rec.adjuntos||[]) : [];
  const pName = (projById(data.projectId)||{}).name || '';

  // 1) subir adjuntos nuevos a Google Drive (si hay sincronización configurada)
  let subidos=0;
  if(S.cfg.url){
    for(const a of _editEntryAtts){
      if(!a.driveId && a.dataUrl){
        try{ setDot('busy'); toast('Subiendo '+(a.name||'archivo')+'…');
          const up=await driveUpload(a, pName); a.driveId=up.id; a.url=up.url; subidos++;
        }catch(err){ console.error(err); toast('No se pudo subir '+(a.name||'archivo')+' (queda local)'); }
      }
    }
  }
  // 2) cache local de bytes (no se sincroniza): guardar los que tengan dataUrl, borrar los quitados
  const keep=new Set(_editEntryAtts.map(a=>a.id));
  for(const a of prevAtts){ if(!keep.has(a.id)){ await dbDel('atts',a.id); delete S.attBytes[a.id]; } }
  for(const a of _editEntryAtts){ if(a.dataUrl){ await dbPut('atts',{id:a.id,entryId:rec.id,dataUrl:a.dataUrl}); S.attBytes[a.id]=a.dataUrl; } }
  // 3) metadata (ligera, sí sincroniza) en la nota
  data.adjuntos = _editEntryAtts.map(a=>({id:a.id,name:a.name,type:a.type,size:a.size||0,driveId:a.driveId||null,url:a.url||null}));

  Object.assign(rec,data,{updatedAt:now(),deleted:false});
  if(!id) S.entries.push(rec);
  await dbPut('entries',rec);
  if(S.cfg.autor!==data.autor && data.autor){ S.cfg.autor=data.autor; await metaSet('cfg',S.cfg); }
  updateSyncDot();
  closeSheet(); toast(subidos?`Nota guardada · ${subidos} archivo(s) en Drive`:'Nota guardada'); scheduleSync(); render();
}
async function delEntry(id){
  if(!confirm('¿Eliminar esta nota?')) return;
  const e=S.entries.find(x=>x.id===id); e.deleted=true; e.updatedAt=now(); await dbPut('entries',e);
  closeSheet(); toast('Nota eliminada'); scheduleSync(); render();
}

async function sendEmail(id){

    const driveIds = attach ? (e.adjuntos||[]).filter(a=>a.driveId).map(a=>a.driveId) : [];
    try{ setDot('busy'); toast('Enviando correo…');
      const res=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({token:S.cfg.token, action:'email', to, cc, subject, html:noteToHTML(e), text:noteToText(e), driveIds})});
      const d=await res.json(); updateSyncDot();
      if(!d.ok) throw new Error(d.error||'falló el envío');
      closeSheet(); toast(`Correo enviado a ${d.sent}${d.adjuntos?` · ${d.adjuntos} adj.`:''}`);
    }catch(err){ setDot('err'); toast('No se pudo enviar: '+err.message); }
  } else {
    const ccp=cc?`&cc=${encodeURIComponent(cc)}`:'';
    window.location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}${ccp}&body=${encodeURIComponent(noteToText(e))}`;
    closeSheet();
  }
}

let _syncTimer=null;
function scheduleSync(){ if(!S.cfg.url) return; clearTimeout(_syncTimer); _syncTimer=setTimeout(syncNow,4000); }
function setDot(cls){ const d=$('#syncDot'); d.className='syncdot'+(cls?' '+cls:''); }
function updateSyncDot(){ setDot(S.cfg.url?'on':''); }

async function syncNow(){
  if(!S.cfg.url){ toast('Configura la URL de sincronización'); openConfig(); return; }
  setDot('busy'); $('#btnSync').style.transform='rotate(360deg)'; $('#btnSync').style.transition='.6s';
  try{
    // 1) push cambios locales + 2) pull remotos; el servidor hace merge last-write-wins
    const payload={ token:S.cfg.token, action:'sync', since:S.cfg.lastSync||0,
      projects:S.projects, entries:S.entries.map(stripHeavy), tasks:S.tasks, files:S.files };
    const res=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'respuesta inválida');
    await mergeRemote(data);
    S.cfg.lastSync=now(); await metaSet('cfg',S.cfg);
    setDot('on'); toast(`Sincronizado · ${data.counts?`${data.counts.projects||0}P ${data.counts.entries||0}N ${data.counts.tasks||0}T`:''}`);
    render();
  }catch(err){ setDot('err'); toast('Error al sincronizar: '+err.message); console.error(err); }
  finally{ setTimeout(()=>{$('#btnSync').style.transform='';},650); }
}
function stripHeavy(e){ const {campos,adjuntos,...r}=e; return {...r, camposJSON:JSON.stringify(campos||{}), adjuntosJSON:JSON.stringify(adjuntos||[])}; }
async function mergeRemote(data){
  const put=async(store,arr,key)=>{ for(const r of (arr||[])){
    const local=(S[key]||[]).find(x=>x.id===r.id);
    const rr = key==='entries'
      ? {...r, campos: r.camposJSON?safeJSON(r.camposJSON):(r.campos||{}), adjuntos: r.adjuntosJSON?safeJSON(r.adjuntosJSON):(r.adjuntos||[])}
      : r;
    delete rr.camposJSON; delete rr.adjuntosJSON;
    // Normalizar fechas (Sheets puede devolverlas como fecha/hora ISO) a "YYYY-MM-DD"
    const d10=v=>{ if(v==null||v==='') return ''; const s=String(v); return s.length>=10?s.slice(0,10):s; };
    if(key==='entries'||key==='files') rr.fecha=d10(rr.fecha);
    if(key==='tasks') rr.vence=d10(rr.vence);
    if(key==='projects'){ rr.inicio=d10(rr.inicio); rr.fin=d10(rr.fin); }
    if(!local || (r.updatedAt||0)>(local.updatedAt||0)){
      await dbPut(store,rr);
      const i=(S[key]).findIndex(x=>x.id===r.id);
      if(i>=0) S[key][i]=rr; else S[key].push(rr);
    }
  }};
  await put('projects',data.projects,'projects');
  await put('entries',data.entries,'entries');
  await put('tasks',data.tasks,'tasks');
  await put('files',data.files,'files');
}
function safeJSON(s){ try{return JSON.parse(s);}catch(_){return {};} }

async function doLogin(){
  const username=$('#li_user').value.trim(), password=$('#li_pass').value;
  if(!username||!password){ loginErr('Escribe usuario y contraseña'); return; }
  loginErr(''); const btn=$('#li_btn'); btn.disabled=true; btn.textContent='Entrando…';
  const tryLogin=(tk)=>fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:tk, action:'login', username, password})}).then(r=>r.json());
  try{
    let tk=S.cfg.token||DEFAULT_TOKEN;
    let d=await tryLogin(tk);
    if(!d.ok && /token/i.test(d.error||'') && tk!==DEFAULT_TOKEN){ tk=DEFAULT_TOKEN; d=await tryLogin(tk); }
    if(d.ok && tk!==S.cfg.token){ S.cfg.token=tk; await metaSet('cfg',S.cfg); } // auto-reparar token viejo
    if(!d.ok) throw new Error(d.error||'No se pudo entrar');
    S.session={id:d.user.id, username:d.user.username, nombre:d.user.nombre, role:d.user.role, token:d.token};
    S.perms=d.permisos||DEFAULT_PERMS;
    await metaSet('session',S.session); await metaSet('perms',S.perms);
    $('#li_pass').value='';
    hideLogin(); startApp();
  }catch(err){ loginErr(err.message); }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
}

async function importJSON(file){ if(!file) return;

  for(const p of d.projects||[]) await dbPut('projects',p);
  for(const e of d.entries||[])  await dbPut('entries',e);
  for(const t of d.tasks||[])    await dbPut('tasks',t);
  for(const fl of d.files||[])   await dbPut('files',fl);
  for(const a of d.atts||[])     await dbPut('atts',a);
  await loadAll(); closeSheet(); toast('Datos restaurados'); render();
}

/* ============================================================
   Búsqueda (bitácora)
   ============================================================ */
$('#bitSearch').oninput=e=>{ S.bitQuery=e.target.value; renderBitacora(); };
$('#fileSearch').oninput=e=>{ S.fileQuery=e.target.value; renderArchivos(); };
$('#fileSort').onchange=e=>{ S.fileSort=e.target.value; renderArchivos(); };

/* ============================================================
   PWA install
   ============================================================ */
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); _deferredPrompt=e;
  if(!localStorage.getItem('pwa_done_et')) $('#pwaBanner').classList.add('show'); });
$('#pwaInstall').onclick=async()=>{ $('#pwaBanner').classList.remove('show'); localStorage.setItem('pwa_done_et','1');
  if(_deferredPrompt){ _deferredPrompt.prompt(); await _deferredPrompt.userChoice; _deferredPrompt=null; } };
$('#pwaClose').onclick=()=>{ $('#pwaBanner').classList.remove('show'); localStorage.setItem('pwa_done_et','1'); };

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ============================================================
   Arranque
   ============================================================ */
(async function init(){
  await openDB(); await loadAll();
  if(!S.session){ showLogin(); return; }
  startApp();
})();
function startApp(){
  hideLogin();
  updateSyncDot(); render(); applyRoleUI();
  if(S.cfg.url){ setTimeout(syncNow,1000); setTimeout(refreshTeamPerms,1400); }
}
</script>
